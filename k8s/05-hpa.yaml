---
# ── Payment worker autoscaler ─────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jq-worker-payment-hpa
  namespace: job-queue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       jq-worker-payment
  minReplicas: 2
